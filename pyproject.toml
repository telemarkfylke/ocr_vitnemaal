[project]
name = "vitnemal-ocr"
version = "0.1.0"
description = "OCR processing for student transcripts (vitnemål) using Mistral AI"
requires-python = ">=3.10"
readme = "README.md"
authors = [
    {name = "Vestfold Fylkeskommune"},
]
keywords = ["ocr", "mistral-ai", "transcript", "vitnemal", "document-processing"]
dependencies = [
    "mistralai>=1.9.0",
    "pydantic>=2.12.0",
    "pydantic-core>=2.41.0",
    "python-dotenv>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "types-python-dateutil>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
